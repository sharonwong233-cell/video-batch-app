<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>VideoBatch — 视频拼接切分</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22">
        <rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <polygon points="10,9 16,12 10,15" fill="currentColor"/>
      </svg>
    </div>
    <div class="header-title">
      <h1>VideoBatch</h1>
      <p>剪片头 · 拼接 · 按分钟切分 · 色块打码</p>
    </div>
    <div class="header-status" id="header-status">空闲</div>
  </header>

  <main>
    <!-- 左栏：素材 -->
    <section class="panel clip-panel" aria-label="素材列表">
      <div class="panel-head">
        <h2>素材</h2>
        <span class="queue-count" id="queueCount">0 个文件</span>
      </div>

      <div class="field clip-source">
        <div class="path-row">
          <input type="text" id="inputDir" placeholder="选择素材文件夹…" readonly>
          <button id="btn-input" class="btn btn-ghost" type="button">浏览</button>
        </div>
      </div>

      <div class="clip-list" id="clipList">
        <div class="empty-state">
          <p>还没有素材。</p>
          <p class="empty-sub">选择文件夹自动加载，拖动调整拼接顺序。</p>
        </div>
      </div>
    </section>

    <!-- 右栏：配置 + 结果 -->
    <section class="panel config-panel" aria-label="处理配置">
      <div class="panel-head">
        <h2>配置</h2>
      </div>

      <div class="field-row cfg-row">
        <div class="field">
          <label for="trimHead">剪掉片头（秒）</label>
          <input type="number" id="trimHead" value="0" min="0" step="1">
        </div>
        <div class="field">
          <label for="segmentMin">每段分钟数</label>
          <input type="number" id="segmentMin" value="5" min="1" step="1">
        </div>
      </div>

      <div class="field">
        <label for="outputDir">输出文件夹 <span class="hint">留空则自动生成</span></label>
        <div class="path-row">
          <input type="text" id="outputDir" placeholder="留空 = 素材文件夹_merged" readonly>
          <button id="btn-output" class="btn btn-ghost" type="button">浏览</button>
        </div>
      </div>

      <div class="field">
        <label class="checkbox-line">
          <input type="checkbox" id="maskEnabled">
          <span class="switch" aria-hidden="true"></span>
          <span>添加色块打码</span>
        </label>
      </div>

      <div id="mask-config" class="mask-config" hidden>
        <div class="mask-preview-wrap">
          <div class="mask-preview" id="maskPreview" aria-hidden="true">
            <div class="preview-frame">
              <div class="preview-corners"></div>
              <span class="preview-label">16:9</span>
            </div>
            <div class="preview-box" id="previewBox"></div>
          </div>
          <p class="mask-preview-caption">实时预览色块位置</p>
        </div>

        <div class="field">
          <label for="maskColor">颜色</label>
          <div class="color-row">
            <input type="color" id="maskColor" value="#e4573d">
            <input type="text" id="maskColorText" value="#e4573d" spellcheck="false">
            <div class="swatches" id="swatches" role="listbox" aria-label="预设颜色">
              <button type="button" class="swatch" data-color="#000000" style="background:#000" title="黑色" role="option"></button>
              <button type="button" class="swatch" data-color="#ffffff" style="background:#fff" title="白色" role="option"></button>
              <button type="button" class="swatch" data-color="#e4573d" style="background:#e4573d" title="红色" role="option"></button>
              <button type="button" class="swatch" data-color="#3e8ef7" style="background:#3e8ef7" title="蓝色" role="option"></button>
              <button type="button" class="swatch" data-color="#2fbf71" style="background:#2fbf71" title="绿色" role="option"></button>
              <button type="button" class="swatch" data-color="#f0b429" style="background:#f0b429" title="黄色" role="option"></button>
            </div>
          </div>
        </div>

        <div class="field-row cfg-row">
          <div class="field">
            <label for="maskSize">大小</label>
            <div class="size-row">
              <select id="maskSizeType">
                <option value="pct">宽度百分比</option>
                <option value="px">固定像素</option>
              </select>
              <input type="text" id="maskSizeValue" value="15" spellcheck="false">
            </div>
          </div>
          <div class="field">
            <label for="maskPos">位置</label>
            <div class="pos-row" id="posRow">
              <button type="button" class="pos-btn active" data-pos="topleft" aria-pressed="true">左上</button>
              <button type="button" class="pos-btn" data-pos="topright" aria-pressed="false">右上</button>
            </div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="btn-start" class="btn btn-primary" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><polygon points="6,4 20,12 6,20" fill="currentColor"/></svg>
          开始处理
        </button>
        <button id="btn-cancel" class="btn btn-ghost" type="button" disabled>取消</button>
      </div>

      <div class="overall-progress" id="overallProgress" hidden>
        <div class="overall-bar"><div class="overall-fill" id="overallFill"></div></div>
        <span class="overall-text" id="overallText"></span>
      </div>

      <div class="summary" id="summary" hidden>
        <span id="summaryText"></span>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
